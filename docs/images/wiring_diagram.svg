<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="450" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Zin Robo Buddy: Wiring Diagram</text>

  <!-- ESP32-C3 Super Mini -->
  <rect x="60" y="70" width="210" height="250" rx="12" fill="#0f4c5c" stroke="#0b3440" stroke-width="2"/>
  <rect x="130" y="56" width="70" height="22" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <text x="165" y="72" text-anchor="middle" font-size="12" fill="#111827">USB-C</text>
  <text x="140" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ESP32-C3</text>
  <text x="140" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Super Mini</text>
  <text x="140" y="300" text-anchor="middle" font-size="11" fill="#cbd5e1">(unused pins not shown)</text>

  <!-- ESP pins -->
  <g font-size="14" fill="#ffffff" text-anchor="end">
    <text x="252" y="135">3V3</text>
    <text x="252" y="175">GND</text>
    <text x="252" y="215">GPIO 8</text>
    <text x="252" y="255">GPIO 9</text>
  </g>
  <g fill="#fbbf24" stroke="#92400e" stroke-width="1.5">
    <circle cx="270" cy="130" r="7"/><circle cx="270" cy="170" r="7"/>
    <circle cx="270" cy="210" r="7"/><circle cx="270" cy="250" r="7"/>
  </g>

  <!-- OLED module -->
  <rect x="520" y="70" width="190" height="250" rx="10" fill="#1e3a8a" stroke="#172554" stroke-width="2"/>
  <g font-size="14" fill="#ffffff" text-anchor="start">
    <text x="538" y="135">VCC</text>
    <text x="538" y="175">GND</text>
    <text x="538" y="215">SDA</text>
    <text x="538" y="255">SCL</text>
  </g>
  <g fill="#fbbf24" stroke="#92400e" stroke-width="1.5">
    <circle cx="520" cy="130" r="7"/><circle cx="520" cy="170" r="7"/>
    <circle cx="520" cy="210" r="7"/><circle cx="520" cy="250" r="7"/>
  </g>
  <rect x="590" y="105" width="100" height="60" rx="4" fill="#0b1220" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="640" y="132" text-anchor="middle" font-size="14" fill="#7dd3fc">Hello!</text>
  <text x="640" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">0.96" OLED</text>
  <text x="640" y="208" text-anchor="middle" font-size="12" fill="#cbd5e1">SSD1306, 128x64</text>
  <text x="640" y="226" text-anchor="middle" font-size="12" fill="#cbd5e1">I2C address 0x3C</text>

  <!-- Wires -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="277" y1="130" x2="513" y2="130" stroke="#dc2626"/>
    <line x1="277" y1="170" x2="513" y2="170" stroke="#111827"/>
    <line x1="277" y1="210" x2="513" y2="210" stroke="#2563eb"/>
    <line x1="277" y1="250" x2="513" y2="250" stroke="#16a34a"/>
  </g>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <text x="395" y="120">3.3 V power</text>
    <text x="395" y="160">Ground</text>
    <text x="395" y="200">SDA (I2C data)</text>
    <text x="395" y="240">SCL (I2C clock)</text>
  </g>

  <!-- Notes -->
  <text x="380" y="352" text-anchor="middle" font-size="13" fill="#374151">Note: on my OLED module the physical pin order is GND, VCC, SCL, SDA.</text>
  <text x="380" y="371" text-anchor="middle" font-size="13" fill="#374151">Connect by pin label, not by position, and check your own board.</text>

  <!-- Planned power -->
  <rect x="60" y="390" width="650" height="42" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="385" y="415" text-anchor="middle" font-size="13" fill="#4b5563">Planned, not wired yet: 3.7 V 300 mAh Li-ion cell + Type-C charging module (power system)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
